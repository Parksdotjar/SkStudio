<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkStudio</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Custom title bar -->
    <div class="titlebar" data-tauri-drag-region>
      <div class="titlebar-left" data-tauri-drag-region>
        <div class="logo" data-tauri-drag-region>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#3ddc84" stroke="#3ddc84" stroke-width="0.4" stroke-linejoin="round">
            <path d="M12 1.2 L 13.1 9.4 L 22.8 12 L 13.1 14.6 L 12 22.8 L 10.9 14.6 L 1.2 12 L 10.9 9.4 Z"/>
          </svg>
        </div>
        <div class="menu-bar" data-tauri-drag-region>
          <button class="menu-item" data-menu="file">File</button>
          <button class="menu-item" data-menu="edit">Edit</button>
          <button class="menu-item" data-menu="tools">Tools</button>
          <button class="menu-item" data-menu="other">Other</button>
        </div>
        <button class="titlebar-icon-btn" id="settings-btn" title="Settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
      <div class="titlebar-controls">
        <button class="titlebar-btn" id="min-btn" title="Minimize">
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button class="titlebar-btn" id="max-btn" title="Maximize">
          <svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" stroke="currentColor" fill="none"/></svg>
        </button>
        <button class="titlebar-btn close" id="close-btn" title="Close">
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0L10 10M10 0L0 10" stroke="currentColor" stroke-width="1"/></svg>
        </button>
      </div>
    </div>

    <!-- Main app -->
    <div class="app">
      <!-- Sidebar -->
      <aside class="sidebar">
        <button class="sidebar-btn active" data-panel="explorer" title="Explorer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
        </button>
        <button class="sidebar-btn" data-panel="parser" title="Parser">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"/>
            <polyline points="8 6 2 12 8 18"/>
          </svg>
        </button>
      </aside>

      <!-- Editor area -->
      <main class="editor-area">
        <!-- Tab bar -->
        <div class="tab-bar">
          <div class="tabs" id="tabs">
            <!-- tabs injected by JS -->
          </div>
          <button class="new-tab-btn" id="new-tab-btn" title="New tab">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
        </div>

        <!-- Content -->
        <div class="content" id="content">
          <!-- Welcome screen / editor injected by JS -->
        </div>

        <!-- Status bar -->
        <div class="status-bar" id="status-bar">
          <div class="status-left"></div>
          <div class="status-right">
            <span id="status-line">Line 1</span>
            <span id="status-col">Column 1</span>
            <span id="status-len">Length 0</span>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
